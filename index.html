function mine(){const p=person('me');const saved=allContent().filter(x=>state.saved.includes(x.id));return `<div class="page-title between"><div><h1>我的兴趣世界</h1><p>让你的热爱有迹可循，让同好更容易认识你。</p></div><button class="text-btn" data-action="credit">750+ 已准入 ${icon('arrow')}</button></div><div class="main-grid"><section><div class="profile-top"><div class="row"><span class="avatar">${p.letter}</span><span>${esc(p.name)}</span><span class="level">兴趣自述</span></div><h2>${esc(p.identity)}</h2><p>${esc(p.bio)||'你最近喜欢的作品、品牌和故事，都可以成为相遇的起点。'}</p><div class="interest-tags">${state.interests.map(x=>`<span>${x}</span>`).join('')}</div><div class="profile-counts"><span><b>${state.following.length}</b> 关注</span><span><b>${state.saved.length}</b> 收藏</span><span><b>${state.posts.length}</b> 分享</span></div><button class="secondary" data-action="builder">${state.profile?'编辑兴趣主页':'用 AI 整理我的主页'}</button></div><div class="section-head"><h2>最近关注的事物</h2></div><div class="object-list">${p.objects.length?p.objects.map(o=>`<span>${esc(o)}</span>`).join(''):'<p class="muted">添加作品、品牌或工作室，建立你的兴趣坐标。</p>'}</div>${state.profile?`<div class="aside-card ai-summary"><span class="source-label">AI 整理 · 本人已确认 · 本地示例</span><h3>${esc(state.profile.headline)}</h3><p>${esc(state.profile.summary)}</p></div>`:''}<div class="between section-head"><h2>${profileView==='收藏'?'我的收藏':'我的分享'}</h2><div class="square-tabs"><button class="${profileView!=='收藏'?'active':''}" data-profile-view="主页">分享</button><button class="${profileView==='收藏'?'active':''}" data-profile-view="收藏">收藏</button></div></div><div class="feed-grid">${(profileView==='收藏'?saved:state.posts).map(card).join('')||empty(profileView==='收藏'?'还没有收藏':'让同好看见你的喜欢',profileView==='收藏'?'在广场收藏一条想再看的内容。':'分享一段真实感受，让兴趣主页更完整。')}</div><button class="primary" data-action="publish" style="margin-top:16px">+ 分享最近的喜欢</button></section><aside><div class="aside-card"><h3>热爱，慢慢留下印记</h3><div class="badges"><div class="badge">${icon('star')}<strong>初见同好</strong><small>已点亮</small></di function detail(id){const x=allContent().find(x=>x.id===id);if(!x)return;const p=person(x.person);const gallery=x.images?.length?`<div class="detail-gallery">${x.images.map((src,i)=>`<figure><img src="${src}" alt="${esc(x.object)}资料图片 ${i+1}" loading="eager"><figcaption>${esc(x.imageCredit||'作品资料图')} · ${i+1}/${x.images.length}</figcaption></figure>`).join('')}</div>`:cover(x);modal(x.title,`${gallery}<p class="detail-body" style="margin-top:16px">${esc(x.body)}</p><p class="object-tag"># ${esc(x.object)} · ${esc(x.category)}</p><div class="service-detail"><h3>图片与内容说明</h3><p>${esc(x.related)}</p></div>${x.source?`<p class="photo-source">作品资料来源：<a href="${x.source}" target="_blank" rel="noreferrer">${esc(x.imageCredit||'查看原始资料')}</a></p>`:''}<button class="person-link row" data-person="${p.id}"><span class="avatar">${p.letter}</span><span><strong>${esc(p.name)}</strong><small>${esc(p.identity)} · 查看兴趣主页 ${'→'}</small></span></button><div class="dialog-actions"><button class="primary" data-save="${id}" data-detail-refresh="true">${state.saved.includes(id)?'已收藏 · 点击取消':'收藏这条内容'}</button>${p.id==='me'?'':followBtn(p.id)}</div><p class="model-note" style="margin-top:15px">人物及分享文字为原型演示。暂不开放评论，可以通过认可与收藏表达共鸣。</p>`)}
function showPerson(id){if(id==='me'){$('#modal').close();go('profile');return}const p=person(id);modal(p.name,`<div class="person-profile"><span class="avatar">${p.letter}</span><h3>${p.identity}</h3><p>${p.place} · 信用准入已验证（演示）</p><p>${p.bio}</p><span class="source-label">身份为兴趣自述，非专业认证</span></div><h3 style="margin:18px 0 10px">最近关注</h3><div class="object-list">${p.objects.map(t=>`<span>${t}</span>`).join('')}</div><h3 style="margin:18px 0 10px">关注后，你会看到</h3><p>他的亲身分享，以及围绕这些兴趣对象整理的内容。</p><div class="option-list">${content.filter(x=>x.person===id).map(x=>`<button class="option" data-detail="${x.id}"><div><b>${x.title}</b><small>${x.kind}</small></div>${icon('arrow')}</button>`).join('')}</div><div class="dialog-actions">${followBtn(id)}</div>`)}
function builder(){const p=draft||state.profile;modal('把最近的喜欢，整理成你的主页',`<div class="steps"><b>01 描述兴趣</b><span>02 AI 整理</span><span>03 确认公开</span></div><p>输入作品、品牌或工作室，再聊一句你的感受。此原型使用本地规则展示 AI 整理流程。</p><form id="builder-form"><label class="field">你的昵称<input name="name" required maxlength="16" value="${esc(p?.name||'茂夫')}"></label><label class="field">你想如何介绍自己？<input name="identity" required maxlength="24" value="${esc(p?.identity||'潮玩与游戏爱好者')}"></label><label class="field">最近关注的作品 / 品牌 / 工作室<input name="objects" required maxlength="150" placeholder="例如：LABUBU、空洞骑士、葬送的芙莉莲" value="${esc(p?.objects.join('、')||'')}"></label><label class="field">为什么喜欢？<textarea name="bio" required minlength="5" maxlength="240" placeholder="比起跟随热度，我更在意角色设计和故事…">${esc(p?.bio||'')}</textarea></label><button class="primary" style="width:100%">生成兴趣主页草稿</button></form>`)}

document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;if(d.action==='close'){$('#modal').close();return}if(d.theme){state.theme=d.theme;saveState();applyTheme();render();toast(d.theme==='pop'?'已切换为活泼二次元风格':'已切换为尊贵黑金风格');return}if(d.action==='verify'){state.score=Number($('#demo-score').value);state.admitted=state.score>=750;saveState();if(!state.admitted){$('#gate-message').textContent='当前演示结果为 '+state.score+' 分，未达到 750 分准入标准。';return}render();if(!state.onboarded)preferences(true);return}if(!state.admitted||state.score<750){toast('请先完成 750 分准入验证');return}if(d.page){go(d.page)}else if(d.category){category=d.category;feedLimit=20;render()}else if(d.interest){interestDraft=interestDraft.includes(d.interest)?interestDraft.filter(t=>t!==d.interest):[...interestDraft,d.interest];interestFocus=d.interest;b.classList.toggle('active');b.setAttribute('aria-pressed',interestDraft.includes(d.interest));$('#interest-feedback').innerHTML=interestPreview()}else if(d.follow){toggle('following',d.follow);render();document.querySelectorAll(`[data-follow="${d.follow}"]`).forEach(x=>{x.textContent=state.following.includes(d.follow)?'已关注':'+ 关注';x.classList.toggle('is-following',state.following.includes(d.follow))});toast(state.following.includes(d.follow)?'已关注，相关内容已加入「关注」':'已取消关注')}else if(d.save){toggle('saved',d.save);render();if(d.detailRefresh)detail(d.save);else toast(state.saved.includes(d.save)?'已加入我的收藏':'已取消收藏')}else if(d.like){toggle('liked',d.like);render()}else if(d.detail){detail(d.detail)}else if(d.person){showPerson(d.person)}else if(d.why){const x=allContent().find(x=>x.id===d.why);modal('为什么这条内容来到你面前',`<div class="service-detail"><h3>${reason(x)}</h3><p>兴趣标签和具体关键词优先，结合附近热度、同号认可与内容质量进行整理。优质内容也会突破地理范围，传播给更远处的同好。</p></div><p>本条领域为 ${x.category}，来源标注为 ${x.platform||'公开资讯'}。第一阶段不设信用分门槛，信用信息不参与资讯质量排序。</p>`)}else if(d.place){state.place=d.place;saveState();render();map()}else if(d.profileView){profileView=d.profileView;render()}else if(d.action){switch(d.action){case'preferences':preferences();break;case'apply-interests':if(!interestDraft.length){toast('至少点亮一个你感兴趣的领域');return}state.interests=[...interestDraft];state.place=$('#interest-place').value||state.place;state.onboarded=true;state.interestExperienceSeen=true;saveState();feedLimit=20;render();map(true);break;case'load-more':feedLimit+=20;render();break;case'map':map();break;case'nearby':nearby=!nearby;feedLimit=20;render();break;case'builder':builder();break;case'publish':publish();break;case'discover':modal('认识兴趣相投的同好',`<p>从他关注的事物，了解他的品味。</p>${peopleList()}`);break;case'clear-search':query='';feedLimit=20;$('#search').value='';render();break;case'location':modal('选择探索街区',`<p>只使用街区关系，不需要精确地址。</p><div class="option-list">${['杭州 · 滨江','杭州 · 西湖','上海 · 徐汇'].map(p=>`<button class="option" data-place="${p}"><b>${p}</b>${icon(state.place===p?'check':'arrow')}</button>`).join('')}</div>`);break;case'credit':modal('第一阶段不设信用门槛',`<p>浏览资讯与使用基础功能无需验证信用分。后续只在精确距离社交等需要建立信任的场景中再评估限制。</p>`);break;case'reset-gate':state.admitted=true;saveState();$('#modal').close();render();break;case'notifications':modal('同好消息',`<p>暂时没有新消息。你关注之人的分享可在「关注」中查看。</p><button class="primary" data-action="to-following">查看关注内容</button>`);break;case'to-following':$('#modal').close();go('following');break}}});
document.addEventListener('submit',e=>{e.preventDefault();if(!state.admitted||state.score<750){toast('请先完成准入验证');return}const f=e.target,fd=new FormData(f);if(f.id==='search-form'){query=$('#search').value.trim();page='square';category='全部';nearby=false;render()}else if(f.id==='builder-form'){const name=String(fd.get('name')).trim(),identity=String(fd.get('identity')).trim(),bio=String(fd.get('bio')).trim(),objects=String(fd.get('objects')).split(/[,，、;；\n]+/).map(s=>s.trim()).filter(Boolean).slice(0,8);if(!name||!identity||bio.length<5||!objects.length){toast('请补充昵称、身份、兴趣对象和至少 5 个字的感受');return}draft={name,identity,bio,objects,headline:`${name}的兴趣坐标`,summary:`我是${identity}，最近关注${objects.join('、')}。\n\n${bio}`};draftView()}else if(f.id==='confirm-form'){if(!draft||!fd.get('consent')){toast('请检查草稿并确认公开');return}const headline=String(fd.get('headline')).trim(),summary=String(fd.get('summary')).trim();if(!headline||summary.length<5){toast('请完善主页标题和简介');return}state.profile={...draft,headline,summary};saveState();draft=null;$('#modal').close();go('profile');toast('兴趣主页已建立，已点亮「兴趣主理人」')}else if(f.id==='publish-form'){const title=String(fd.get('title')).trim(),body=String(fd.get('body')).trim(),object=String(fd.get('object')).trim(),cat=String(fd.get('category'));if(!title||body.length<5||!object||!categories.includes(cat)){toast('请填写完整内容，感受至少 5 个字');return}state.posts.unshift({id:'p'+Date.now(),person:'me',category:cat,title,body,object,kind:'本人分享 · 刚刚',likes:0,quality:70,cover:({潮玩:'toy',游戏:'game',动漫:'anime',漫画:'comic',电影:'movie',电视剧:'tv',书籍:'book'})[cat],coverTitle:esc(object),note:'MY INTEREST JOURNAL',related:'由你主动发布的亲身感受，保存在当前设备。'});saveState();$('#modal').close();category='全部';nearby=false;go('square');toast('已发布到本机广场，不开放评论')}});
$('#modal').addEventListener('click',e=>{if(e.target===$('#modal')){const r=$('#modal').getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)$('#modal').close()}});render();
